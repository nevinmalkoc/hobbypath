version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hobbypath_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hobbypath_db
      POSTGRES_USER: hobbypath_user
      POSTGRES_PASSWORD: hobbypath_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hobbypath_user -d hobbypath_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hobbypath_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
