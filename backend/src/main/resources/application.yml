server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hobbypath-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/hobbypath_db
    username: hobbypath_user
    password: hobbypath_secret_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    com.hobbypath: DEBUG
    org.springframework.security: INFO
