server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: hobbypath-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/hobbypath_db
    username: hobbypath_user
    password: hobbypath_secret_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

application:
  security:
    jwt:
      # 256-bit minimum HMAC-SHA256 secret key in Base64
      secret-key: dGhpc2lzYXZlcnlzZWNyZXRrZXlmb3Job2JieXBhdGhhcHBsaWNhdGlvbjIwMjY=
      # 24 hours in milliseconds (86400000)
      expiration-ms: 86400000

logging:
  level:
    com.hobbypath: DEBUG
    org.springframework.security: INFO
